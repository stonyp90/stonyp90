<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anthony Paquet, AI and Cloud Architect, Engineering Leader">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c4b394" stroke-width="1" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Cream paper + faint editorial grid -->
  <rect width="1200" height="630" fill="#f6efe0"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d8cbb0" stroke-width="2"/>

  <!-- Brand mark — three vertical bars -->
  <g transform="translate(100 108)">
    <rect x="0" y="16" width="11" height="22" rx="2" fill="#edb265"/>
    <rect x="18" y="2" width="11" height="36" rx="2" fill="#d4831f"/>
    <rect x="36" y="9" width="11" height="29" rx="2" fill="#1b1714"/>
  </g>

  <!-- Eyebrow -->
  <text x="102" y="232" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" letter-spacing="7" fill="#463f38">AI &amp; CLOUD ARCHITECT&#160;&#160;·&#160;&#160;ENGINEERING LEADER</text>

  <!-- Name -->
  <text x="96" y="378" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="118" fill="#1b1714">Anthony Paquet<tspan fill="#d4831f">.</tspan></text>
  <rect x="102" y="404" width="446" height="6" rx="3" fill="#d4831f"/>

  <!-- Tagline -->
  <text x="102" y="480" font-family="Georgia,'Times New Roman',serif" font-size="39" fill="#463f38">Ship faster, cut costs, become compliant.</text>

  <!-- URL -->
  <text x="102" y="546" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" letter-spacing="2" fill="#8f5310">anthonypaquet.com</text>
</svg>

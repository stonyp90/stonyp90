<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9d4edd" stroke-opacity="0.1" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo/Icon -->
  <g transform="translate(100, 160)">
    <rect width="140" height="140" rx="32" fill="url(#accentGradient)"/>
    <text x="70" y="98" font-family="'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="bold" letter-spacing="-4" fill="#0f172a" text-anchor="middle">AP</text>
  </g>

  <!-- Name -->
  <text x="270" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="white">Anthony Paquet</text>

  <!-- Title -->
  <text x="270" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#00d4ff">AI &amp; Cloud Security Architect</text>

  <!-- Key Services -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8">Cut cloud costs 30-60% | SOC2/HIPAA in weeks | Build 0-1 to Enterprise</text>

  <!-- Expertise Tags (outline) -->
  <g transform="translate(100, 430)">
    <rect width="100" height="40" rx="20" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="22" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00d4ff">FinOps</text>
  </g>

  <g transform="translate(220, 430)">
    <rect width="160" height="40" rx="20" fill="#9d4edd" fill-opacity="0.06" stroke="#9d4edd" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b07ce8">Cloud Security</text>
  </g>

  <g transform="translate(400, 430)">
    <rect width="140" height="40" rx="20" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00d4ff">Compliance</text>
  </g>

  <g transform="translate(560, 430)">
    <rect width="140" height="40" rx="20" fill="#ff006e" fill-opacity="0.06" stroke="#ff006e" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="22" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ff3d8b">AI/LLM Sec</text>
  </g>

  <!-- Platforms -->
  <text x="100" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">AWS | Azure | GCP | Multi-cloud</text>

  <!-- CTA (outline) -->
  <rect x="100" y="550" width="278" height="50" rx="12" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="124" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#00d4ff">Book Free Strategy Call  &#8594;</text>

  <!-- URL -->
  <text x="960" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">anthonypaquet.com</text>
</svg>
